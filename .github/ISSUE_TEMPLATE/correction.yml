# Generated by scripts/forms.mjs from scripts/forms-spec.mjs. Edit those, then run: npm run forms
name: "Suggest a correction"
description: "Something on an existing page is wrong or missing."
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: "Tell us what is wrong and what the source says. Corrections are reviewed and applied by an editor. See the [contribution guide](https://judaicadh.github.io/kehillot/about/#contribute) for what makes a good suggestion."
  - type: input
    id: record
    attributes:
      label: "Page or record"
      description: "The address of the page, e.g. https://judaicadh.github.io/kehillot/congregation/emanu-el-ny/"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What is wrong or missing?"
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: "What should it say?"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: "Source citation"
      description: "Where this information comes from: author, title, date, page, archive or URL. Every record must cite a source."
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: "Source link (if online)"
      placeholder: "https://"
  - type: dropdown
    id: certainty
    attributes:
      label: "How certain is the information?"
      options:
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: true
  - type: input
    id: contributor
    attributes:
      label: "Your name for the credit line (optional)"
      description: "Shown on the record and on the Contributors page. Leave blank to be credited by your GitHub username only."
  - type: input
    id: orcid
    attributes:
      label: "ORCID iD (optional)"
      placeholder: "0000-0000-0000-0000"
  - type: checkboxes
    id: consent
    attributes:
      label: "Before you submit"
      options:
        - label: "I understand this suggestion and my GitHub username are public."
          required: true
        - label: "This contains no private information about living people."
          required: true
        - label: "I am happy for this contribution to be published under CC BY 4.0."
          required: true
