# Generated by scripts/forms.mjs from scripts/forms-spec.mjs. Edit those, then run: npm run forms
name: "Suggest a congregation"
description: "A Jewish congregation active between 1840 and 1870."
title: "[Congregation] "
labels: ["suggestion", "type: congregation"]
body:
  - type: markdown
    attributes:
      value: "Suggest a congregation. An editor reviews every suggestion before it is published. See the [contribution guide](https://judaicadh.github.io/kehillot/about/#contribute) for what makes a good suggestion."
  - type: input
    id: name
    attributes:
      label: "Name"
    validations:
      required: true
  - type: input
    id: translation
    attributes:
      label: "English meaning of the name"
  - type: dropdown
    id: city
    attributes:
      label: "City"
      options:
        - "Albany (New York)"
        - "Baltimore (Maryland)"
        - "Boston (Massachusetts)"
        - "Buffalo (New York)"
        - "Charleston (South Carolina)"
        - "Chicago (Illinois)"
        - "Cincinnati (Ohio)"
        - "Cleveland (Ohio)"
        - "Detroit (Michigan)"
        - "Easton (Pennsylvania)"
        - "Hartford (Connecticut)"
        - "Houston (Texas)"
        - "Indianapolis (Indiana)"
        - "Louisville (Kentucky)"
        - "Memphis (Tennessee)"
        - "Mobile (Alabama)"
        - "Montgomery (Alabama)"
        - "Natchez (Mississippi)"
        - "New Haven (Connecticut)"
        - "New Orleans (Louisiana)"
        - "New York (New York)"
        - "Newport (Rhode Island)"
        - "Paducah (Kentucky)"
        - "Philadelphia (Pennsylvania)"
        - "Pittsburgh (Pennsylvania)"
        - "Portland (Oregon)"
        - "Richmond (Virginia)"
        - "Rochester (New York)"
        - "Sacramento (California)"
        - "San Francisco (California)"
        - "Savannah (Georgia)"
        - "Sonora (California)"
        - "St. Louis (Missouri)"
        - "Syracuse (New York)"
        - "Washington (District of Columbia)"
        - "Another place (describe it in the address or notes)"
    validations:
      required: true
  - type: input
    id: from
    attributes:
      label: "Year founded"
    validations:
      required: true
  - type: input
    id: to
    attributes:
      label: "Year dissolved or merged (if any)"
  - type: dropdown
    id: rite
    attributes:
      label: "Rite at founding"
      options:
        - "Sephardic"
        - "Ashkenazic"
        - "Reform"
  - type: dropdown
    id: orientation
    attributes:
      label: "Orientation by about 1870"
      options:
        - "Traditional"
        - "Moderate reform"
        - "Reform"
  - type: textarea
    id: note
    attributes:
      label: "Notes"
  - type: textarea
    id: source
    attributes:
      label: "Source citation"
      description: "Where this information comes from: author, title, date, page, archive or URL. Every record must cite a source."
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: "Source link (if online)"
      placeholder: "https://"
  - type: dropdown
    id: certainty
    attributes:
      label: "How certain is the information?"
      options:
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: true
  - type: input
    id: contributor
    attributes:
      label: "Your name for the credit line (optional)"
      description: "Shown on the record and on the Contributors page. Leave blank to be credited by your GitHub username only."
  - type: input
    id: orcid
    attributes:
      label: "ORCID iD (optional)"
      placeholder: "0000-0000-0000-0000"
  - type: checkboxes
    id: consent
    attributes:
      label: "Before you submit"
      options:
        - label: "I understand this suggestion and my GitHub username are public."
          required: true
        - label: "This contains no private information about living people."
          required: true
        - label: "I am happy for this contribution to be published under CC BY 4.0."
          required: true
