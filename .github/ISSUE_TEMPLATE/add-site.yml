# Generated by scripts/forms.mjs from scripts/forms-spec.mjs. Edit those, then run: npm run forms
name: "Suggest a place in a city"
description: "A synagogue building, school, matzah bakery, hotel or boarding house, kosher restaurant, Jewish-owned business, bookstore or other site."
title: "[Place] "
labels: ["suggestion", "type: site"]
body:
  - type: markdown
    attributes:
      value: "Suggest a place for the maps and city guides. An editor reviews every suggestion before it is published. See the [contribution guide](https://judaicadh.github.io/kehillot/about/#contribute) for what makes a good suggestion."
  - type: dropdown
    id: kind
    attributes:
      label: "Kind of place"
      options:
        - "Synagogue building"
        - "Matzah bakery"
        - "Hotel or boarding house"
        - "Kosher restaurant"
        - "Bookstore"
        - "Hospital building"
        - "School or educational institution"
        - "Meeting place"
        - "Jewish-owned business"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: "Name"
      description: "As it appears in the source, e.g. “Levy's Matzah Bakery”."
    validations:
      required: true
  - type: dropdown
    id: city
    attributes:
      label: "City"
      options:
        - "Albany (New York)"
        - "Baltimore (Maryland)"
        - "Boston (Massachusetts)"
        - "Buffalo (New York)"
        - "Charleston (South Carolina)"
        - "Chicago (Illinois)"
        - "Cincinnati (Ohio)"
        - "Cleveland (Ohio)"
        - "Detroit (Michigan)"
        - "Easton (Pennsylvania)"
        - "Hartford (Connecticut)"
        - "Houston (Texas)"
        - "Indianapolis (Indiana)"
        - "Louisville (Kentucky)"
        - "Memphis (Tennessee)"
        - "Mobile (Alabama)"
        - "Montgomery (Alabama)"
        - "Natchez (Mississippi)"
        - "New Haven (Connecticut)"
        - "New Orleans (Louisiana)"
        - "New York (New York)"
        - "Newport (Rhode Island)"
        - "Paducah (Kentucky)"
        - "Philadelphia (Pennsylvania)"
        - "Pittsburgh (Pennsylvania)"
        - "Portland (Oregon)"
        - "Richmond (Virginia)"
        - "Rochester (New York)"
        - "Sacramento (California)"
        - "San Francisco (California)"
        - "Savannah (Georgia)"
        - "Sonora (California)"
        - "St. Louis (Missouri)"
        - "Syracuse (New York)"
        - "Washington (District of Columbia)"
        - "Another place (describe it in the address or notes)"
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: "Street address"
      description: "As recorded at the time, e.g. “96 Essex Street”."
  - type: input
    id: coords
    attributes:
      label: "Latitude, longitude (optional)"
      description: "If you know where it stood. Leave blank and an editor will place it."
      placeholder: "40.7180, -73.9883"
  - type: dropdown
    id: precision
    attributes:
      label: "How exact is that location?"
      options:
        - "Exact"
        - "Approximate"
        - "City only"
  - type: input
    id: from
    attributes:
      label: "Year opened, built or first recorded"
      placeholder: "1855"
  - type: input
    id: to
    attributes:
      label: "Year closed or last recorded"
      placeholder: "1862"
  - type: textarea
    id: people
    attributes:
      label: "Proprietors or people connected with it"
      description: "One per line. Names already in Kehillot are linked automatically."
  - type: textarea
    id: congregations
    attributes:
      label: "Congregations that used it"
      description: "For synagogue buildings and schools. One per line."
  - type: input
    id: supervision
    attributes:
      label: "Kosher supervision"
      description: "For bakeries and restaurants: the rabbi or congregation that certified it."
  - type: textarea
    id: advertised
    attributes:
      label: "Advertised in"
      description: "One per line: periodical and date, e.g. “The Occident, March 1855”."
  - type: textarea
    id: note
    attributes:
      label: "Notes"
      description: "One or two sentences on what the source says."
  - type: textarea
    id: source
    attributes:
      label: "Source citation"
      description: "Where this information comes from: author, title, date, page, archive or URL. Every record must cite a source."
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: "Source link (if online)"
      placeholder: "https://"
  - type: dropdown
    id: certainty
    attributes:
      label: "How certain is the information?"
      options:
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: true
  - type: input
    id: contributor
    attributes:
      label: "Your name for the credit line (optional)"
      description: "Shown on the record and on the Contributors page. Leave blank to be credited by your GitHub username only."
  - type: input
    id: orcid
    attributes:
      label: "ORCID iD (optional)"
      placeholder: "0000-0000-0000-0000"
  - type: checkboxes
    id: consent
    attributes:
      label: "Before you submit"
      options:
        - label: "I understand this suggestion and my GitHub username are public."
          required: true
        - label: "This contains no private information about living people."
          required: true
        - label: "I am happy for this contribution to be published under CC BY 4.0."
          required: true
