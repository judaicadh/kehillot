# Generated by scripts/forms.mjs from scripts/forms-spec.mjs. Edit those, then run: npm run forms
name: "Suggest a person or clergy member"
description: "Rabbis, hazanim, shochtim, communal leaders, proprietors and others."
title: "[Person] "
labels: ["suggestion", "type: person"]
body:
  - type: markdown
    attributes:
      value: "Suggest a person with a documented role in Jewish communal life. An editor reviews every suggestion before it is published. See the [contribution guide](https://judaicadh.github.io/kehillot/about/#contribute) for what makes a good suggestion."
  - type: input
    id: name
    attributes:
      label: "Name"
    validations:
      required: true
  - type: input
    id: born
    attributes:
      label: "Year born"
  - type: input
    id: died
    attributes:
      label: "Year died"
  - type: input
    id: birthplace
    attributes:
      label: "Birthplace"
  - type: dropdown
    id: titles
    attributes:
      label: "Clergy titles (if any)"
      multiple: true
      options:
        - "Rabbi"
        - "Hazan"
        - "Minister"
        - "Preacher"
        - "Chaplain"
        - "Shochet"
        - "Mohel"
        - "Shammash"
  - type: input
    id: occupation
    attributes:
      label: "Other occupations"
      placeholder: "merchant, teacher"
  - type: dropdown
    id: cities
    attributes:
      label: "Cities where they lived or served"
      multiple: true
      options:
        - "Albany (New York)"
        - "Baltimore (Maryland)"
        - "Boston (Massachusetts)"
        - "Buffalo (New York)"
        - "Charleston (South Carolina)"
        - "Chicago (Illinois)"
        - "Cincinnati (Ohio)"
        - "Cleveland (Ohio)"
        - "Detroit (Michigan)"
        - "Easton (Pennsylvania)"
        - "Hartford (Connecticut)"
        - "Houston (Texas)"
        - "Indianapolis (Indiana)"
        - "Louisville (Kentucky)"
        - "Memphis (Tennessee)"
        - "Mobile (Alabama)"
        - "Montgomery (Alabama)"
        - "Natchez (Mississippi)"
        - "New Haven (Connecticut)"
        - "New Orleans (Louisiana)"
        - "New York (New York)"
        - "Newport (Rhode Island)"
        - "Paducah (Kentucky)"
        - "Philadelphia (Pennsylvania)"
        - "Pittsburgh (Pennsylvania)"
        - "Portland (Oregon)"
        - "Richmond (Virginia)"
        - "Rochester (New York)"
        - "Sacramento (California)"
        - "San Francisco (California)"
        - "Savannah (Georgia)"
        - "Sonora (California)"
        - "St. Louis (Missouri)"
        - "Syracuse (New York)"
        - "Washington (District of Columbia)"
        - "Another place (describe it in the address or notes)"
  - type: textarea
    id: roles
    attributes:
      label: "Positions held"
      description: "One per line: role, congregation or institution, years. For example: “Hazan, Mikveh Israel, 1829–1850”."
  - type: textarea
    id: description
    attributes:
      label: "Short description"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: "Source citation"
      description: "Where this information comes from: author, title, date, page, archive or URL. Every record must cite a source."
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: "Source link (if online)"
      placeholder: "https://"
  - type: dropdown
    id: certainty
    attributes:
      label: "How certain is the information?"
      options:
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: true
  - type: input
    id: contributor
    attributes:
      label: "Your name for the credit line (optional)"
      description: "Shown on the record and on the Contributors page. Leave blank to be credited by your GitHub username only."
  - type: input
    id: orcid
    attributes:
      label: "ORCID iD (optional)"
      placeholder: "0000-0000-0000-0000"
  - type: checkboxes
    id: consent
    attributes:
      label: "Before you submit"
      options:
        - label: "I understand this suggestion and my GitHub username are public."
          required: true
        - label: "This contains no private information about living people."
          required: true
        - label: "I am happy for this contribution to be published under CC BY 4.0."
          required: true
